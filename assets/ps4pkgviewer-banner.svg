<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020817"/>
      <stop offset="55%" stop-color="#071426"/>
      <stop offset="100%" stop-color="#020817"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="500" rx="28" fill="url(#bg)"/>
  <path d="M0 410 C360 340, 560 500, 900 390 S1320 275,1600 320" fill="none" stroke="#0b5ed7" stroke-width="3" opacity=".48"/>
  <path d="M0 438 C350 360, 590 520, 900 417 S1320 302,1600 348" fill="none" stroke="#06b6d4" stroke-width="1.5" opacity=".34"/>
  <g opacity=".14" fill="#38bdf8">
    <circle cx="1430" cy="75" r="4"/><circle cx="1460" cy="75" r="4"/><circle cx="1490" cy="75" r="4"/>
    <circle cx="1430" cy="105" r="4"/><circle cx="1460" cy="105" r="4"/><circle cx="1490" cy="105" r="4"/>
    <circle cx="110" cy="75" r="4"/><circle cx="140" cy="75" r="4"/><circle cx="170" cy="75" r="4"/>
  </g>

  <!-- Package/file mark -->
  <g transform="translate(92,98)" filter="url(#glow)">
    <path d="M0 0 H132 L195 63 V250 H0 Z" fill="#061a32" stroke="#e5eefc" stroke-width="9" rx="10"/>
    <path d="M132 0 V63 H195" fill="none" stroke="#e5eefc" stroke-width="9"/>
    <path d="M40 93 L98 65 L157 93 L98 122 Z" fill="#38bdf8"/>
    <path d="M40 93 V155 L98 187 V122 Z" fill="#2563eb"/>
    <path d="M157 93 V155 L98 187 V122 Z" fill="#0ea5e9"/>
    <text x="98" y="226" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700" fill="#ffffff">PKG</text>
  </g>

  <text x="350" y="170" font-family="Segoe UI, Arial, sans-serif" font-size="96" font-weight="800" fill="#ffffff">
    <tspan fill="url(#blue)">PS4</tspan><tspan>PKG</tspan><tspan fill="url(#blue)">Viewer</tspan>
  </text>

  <text x="355" y="235" font-family="Segoe UI, Arial, sans-serif" font-size="39" font-weight="700" fill="#60a5fa">ChayahLabs Compatibility Updates</text>
  <text x="355" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="29" fill="#cbd5e1">PS4 PKG inspection, information viewing and compatibility tools.</text>

  <line x1="355" y1="326" x2="1450" y2="326" stroke="#1687d9" stroke-width="2" opacity=".75"/>

  <text x="355" y="382" font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#cbd5e1">
    Original project by <tspan fill="#60a5fa" font-weight="700">LMAN</tspan>
    <tspan fill="#38bdf8">  •  </tspan>
    Compatibility work by <tspan fill="#60a5fa" font-weight="700">ChayahLabs</tspan>
  </text>

  <text x="355" y="431" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#7dd3fc">Read-only inspection  •  PKG compatibility  •  Regular updates</text>
</svg>